# The structure of the prayer book, part 1 of 2: the book, and sections 1–6.
#
# Curated by reading the text. Every unit starts at its anchor: `heading` is a
# phrase of the red heading as printed, `starts_with` the opening of the text.
# An anchor that occurs more than once in its section picks its occurrence with
# `nth`.
#
# Conventions:
#   * `title` is the heading up to its comma or colon; a prayer without a
#     heading is called by the words it opens with (or by its instruction).
#   * `author` is the author the heading states, in the nominative.
#   * `addressees` names the one the prayer speaks to. God invoked without a
#     Person ("Боже", "Господе Боже") is listed as the Father; "Господе" alone
#     in a petition for mercy as Christ.
#   * `tags` describe the occasion: pokajanje, zahvalnost, zastita, miran-san,
#     za-pokojne, uz-obrok, u-nevolji, u-svako-doba (also for the parts of an
#     akathist or a canon).

[book]
title = "Православни молитвеник"
publisher = "Штампарија Српске патријаршије"
place = "Београд"
year = 1998

